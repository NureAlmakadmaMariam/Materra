<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materra · Dev Upload Tester</title>
<style>
/* ── Reset + tokens ────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #13141a;
  --surface:  #1e2030;
  --surface2: #2d3150;
  --border:   #3b4261;
  --text:     #c0caf5;
  --muted:    #565f89;
  --blue:     #7aa2f7;
  --green:    #9ece6a;
  --red:      #f7768e;
  --yellow:   #e0af68;
  --orange:   #ff9e64;
  --cyan:     #7dcfff;
  --purple:   #bb9af7;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 2rem 1.5rem;
}

.wrap { max-width: 820px; margin: 0 auto; }

/* ── Header ────────────────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 2rem;
}
header h1 { font-size: 1.4rem; font-weight: 800; color: var(--blue); letter-spacing: -0.4px; }
.tag {
  font-size: 0.65rem;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

/* ── Cards ─────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}
.card-title {
  font-size: 0.65rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1.1rem;
}

/* ── Drop zone ─────────────────────────────────────────────────────────── */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 2.2rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  user-select: none;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--blue);
  background: rgba(122, 162, 247, 0.05);
}
.drop-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.drop-icon   { font-size: 2.2rem; margin-bottom: .5rem; }
.drop-text   { font-size: .9rem; color: var(--muted); }
.drop-hint   { font-size: .72rem; color: var(--muted); margin-top: .3rem; opacity: .6; }

/* ── Preview ───────────────────────────────────────────────────────────── */
#previewWrap { display: none; margin-top: 1.2rem; text-align: center; }
#previewImg  {
  max-height: 200px;
  max-width: 100%;
  border-radius: 8px;
  border: 1px solid var(--border);
  object-fit: contain;
}
#fileInfo {
  font-size: .78rem;
  color: var(--muted);
  margin-top: .5rem;
  font-family: monospace;
}

/* ── Upload button ─────────────────────────────────────────────────────── */
#uploadBtn {
  display: block;
  width: 100%;
  padding: .85rem;
  margin-top: 1.1rem;
  background: var(--blue);
  color: #1a1b26;
  font-size: .95rem;
  font-weight: 800;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: .3px;
  transition: filter .15s;
}
#uploadBtn:hover:not(:disabled) { filter: brightness(1.1); }
#uploadBtn:disabled { opacity: .45; cursor: not-allowed; }

/* ── Response card ─────────────────────────────────────────────────────── */
#responseSection { display: none; }

.resp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .6rem;
  margin-bottom: 1rem;
}
.resp-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }

/* Status badge */
.badge {
  display: inline-block;
  font-size: .65rem;
  font-weight: 800;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 20px;
  transition: background .3s, color .3s;
}
.badge-pending       { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.badge-uploading     { background: var(--cyan);   color: #13141a; }
.badge-processing    { background: var(--blue);   color: #13141a; }
.badge-done          { background: var(--green);  color: #13141a; }
.badge-failed        { background: var(--red);    color: #13141a; }
.badge-review_needed { background: var(--yellow); color: #13141a; }
.badge-error         { background: var(--red);    color: #13141a; }

/* Polling pulse */
#pollStatus { display: none; font-size: .75rem; color: var(--blue); }
#pollDot {
  display: inline-block;
  width: 7px; height: 7px;
  background: var(--blue);
  border-radius: 50%;
  margin-right: 4px;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1);   }
  50%       { opacity: .4; transform: scale(.8); }
}

#responseLabel { font-size: .78rem; color: var(--muted); }
#responseTime  { font-size: .7rem;  color: var(--muted); opacity: .6; }

/* ── JSON viewer ───────────────────────────────────────────────────────── */
#jsonOutput {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.2rem 1.4rem;
  font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', ui-monospace, monospace;
  font-size: .8rem;
  line-height: 1.75;
  overflow-x: auto;
  white-space: pre;
}

/* JSON syntax colours */
.jk  { color: var(--cyan);   }   /* key    */
.js  { color: var(--green);  }   /* string */
.jn  { color: var(--orange); }   /* number */
.jb  { color: var(--purple); }   /* bool   */
.jnl { color: var(--red);    }   /* null   */
</style>
</head>
<body>
<div class="wrap">

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header>
    <h1>⬡ Materra</h1>
    <span class="tag">Dev Upload Tester</span>
  </header>

  <!-- ── Upload card ─────────────────────────────────────────────────── -->
  <div class="card">
    <p class="card-title">Image Upload</p>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
      <div class="drop-icon">🖼</div>
      <div class="drop-text">Click or drag an image here</div>
      <div class="drop-hint">JPEG · PNG · WebP · max 10 MB</div>
    </div>

    <div id="previewWrap">
      <img id="previewImg" alt="Preview">
      <div id="fileInfo"></div>
    </div>

    <button id="uploadBtn" disabled>Upload &amp; Analyse</button>
  </div>

  <!-- ── Response card ───────────────────────────────────────────────── -->
  <div class="card" id="responseSection">
    <div class="resp-header">
      <div style="display:flex;align-items:center;gap:.75rem;">
        <span class="badge" id="statusBadge">—</span>
        <span id="pollStatus"><span id="pollDot"></span>polling every 2 s</span>
      </div>
      <div class="resp-meta">
        <span id="responseLabel"></span>
        <span id="responseTime"></span>
      </div>
    </div>
    <pre id="jsonOutput"></pre>
  </div>

</div><!-- /wrap -->

<script>
/* ── Constants ─────────────────────────────────────────────────────────── */
const UPLOAD_URL = "{% url 'analyses:create' %}";
const TERMINAL   = new Set(['done', 'failed', 'review_needed']);
const POLL_MS    = 2000;

/* ── State ─────────────────────────────────────────────────────────────── */
let pollTimer = null;
let pollCount = 0;

/* ── DOM refs ──────────────────────────────────────────────────────────── */
const dropZone       = document.getElementById('dropZone');
const fileInput      = document.getElementById('fileInput');
const uploadBtn      = document.getElementById('uploadBtn');
const previewWrap    = document.getElementById('previewWrap');
const previewImg     = document.getElementById('previewImg');
const fileInfo       = document.getElementById('fileInfo');
const responseSection = document.getElementById('responseSection');
const statusBadge    = document.getElementById('statusBadge');
const pollStatus     = document.getElementById('pollStatus');
const responseLabel  = document.getElementById('responseLabel');
const responseTime   = document.getElementById('responseTime');
const jsonOutput     = document.getElementById('jsonOutput');

/* ── File selection ─────────────────────────────────────────────────────── */

fileInput.addEventListener('change', applyFile);

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer?.files?.[0];
  if (!file) return;
  // Inject the dropped file into the hidden input so the same upload handler works.
  const dt = new DataTransfer();
  dt.items.add(file);
  fileInput.files = dt.files;
  applyFile();
});

function applyFile() {
  const file = fileInput.files[0];
  if (!file) return;
  previewImg.src = URL.createObjectURL(file);
  previewWrap.style.display = 'block';
  fileInfo.textContent =
    `${file.name}  ·  ${(file.size / 1024).toFixed(1)} KB  ·  ${file.type}`;
  uploadBtn.disabled = false;
}

/* ── Upload ─────────────────────────────────────────────────────────────── */

uploadBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  stopPolling();
  uploadBtn.disabled = true;
  uploadBtn.textContent = 'Uploading…';
  setBadge('uploading');

  const fd = new FormData();
  fd.append('image', file);

  try {
    const res  = await fetch(UPLOAD_URL, { method: 'POST', body: fd });
    const data = await res.json();
    renderJSON(data, `Upload response  ·  HTTP ${res.status}`);

    if (res.status === 202 && data?.data?.poll_url) {
      setBadge(data.data.status || 'pending');
      startPolling(data.data.poll_url);
    } else {
      setBadge('error');
    }
  } catch (err) {
    renderJSON({ network_error: err.message }, 'Network error');
    setBadge('error');
  } finally {
    uploadBtn.disabled = false;
    uploadBtn.textContent = 'Upload & Analyse';
  }
});

/* ── Polling ────────────────────────────────────────────────────────────── */

function startPolling(pollUrl) {
  pollCount = 0;
  pollStatus.style.display = 'inline';

  pollTimer = setInterval(async () => {
    pollCount += 1;
    try {
      const res  = await fetch(pollUrl);
      const data = await res.json();
      const jobStatus = data?.data?.status ?? 'unknown';

      renderJSON(data, `Poll #${pollCount}  ·  ${jobStatus}`);
      setBadge(jobStatus);

      if (TERMINAL.has(jobStatus)) {
        stopPolling();
      }
    } catch (err) {
      stopPolling();
      setBadge('error');
    }
  }, POLL_MS);
}

function stopPolling() {
  if (pollTimer !== null) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  pollStatus.style.display = 'none';
}

/* ── UI helpers ─────────────────────────────────────────────────────────── */

function setBadge(s) {
  statusBadge.textContent = s.replace(/_/g, ' ').toUpperCase();
  statusBadge.className   = `badge badge-${s}`;
  responseSection.style.display = 'block';
}

function renderJSON(data, label) {
  responseLabel.textContent = label;
  responseTime.textContent  = 'Updated ' + new Date().toLocaleTimeString();
  jsonOutput.innerHTML      = syntaxHighlight(JSON.stringify(data, null, 2));
}

/**
 * Minimal JSON syntax highlighter.
 * HTML-escapes the raw string first so values like "</span>" can never
 * break the surrounding markup, then wraps tokens in typed <span>s.
 */
function syntaxHighlight(raw) {
  const safe = raw
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  return safe.replace(
    /("(?:\\u[0-9a-fA-F]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|true|false|null|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
    (tok) => {
      if (/^"/.test(tok))
        return /:$/.test(tok)
          ? `<span class="jk">${tok}</span>`   // JSON key
          : `<span class="js">${tok}</span>`;  // string value
      if (tok === 'true' || tok === 'false')
        return `<span class="jb">${tok}</span>`;
      if (tok === 'null')
        return `<span class="jnl">${tok}</span>`;
      return `<span class="jn">${tok}</span>`;   // number
    }
  );
}
</script>
</body>
</html>
